name: BIT-05 CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package.json

      - run: npm install
      - run: npm test

      # NOTE: DB-backed checks (seed, baseline-compare, live API) need Oracle XE
      # and are NOT run here. Run them locally via start-local.bat.

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package.json

      - run: npm install
      - run: npm run build